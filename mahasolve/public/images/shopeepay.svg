<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <!-- ShopeePay Orange Capsule Background -->
  <rect width="260" height="70" rx="16" fill="#EE4D2D"/>
  
  <!-- Wallet / Card Badge Icon -->
  <g transform="translate(20, 15)">
    <!-- Wallet Shape -->
    <rect x="0" y="4" width="36" height="32" rx="6" fill="#FFFFFF"/>
    <!-- Wallet Slot -->
    <path d="M22 14h12v12H22a6 6 0 0 1 0-12z" fill="#EE4D2D"/>
    <circle cx="26" cy="20" r="2.5" fill="#FFFFFF"/>
    <!-- Shopee S Badge -->
    <path d="M12 12c-2.5 0-4 1.5-4 3.5 0 3.5 6 3 6 6 0 1.5-1.5 2.5-3.5 2.5-2 0-3.5-1-4-2.5" stroke="#EE4D2D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: ShopeePay -->
  <text x="72" y="45" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" letter-spacing="-0.5">Shopee</text>
  <text x="175" y="45" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFE0B2" letter-spacing="-0.5">Pay</text>
</svg>
